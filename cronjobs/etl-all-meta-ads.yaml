# Migrated unchanged from clevrr-ai-server/ETL/cronjobs/etl-all-meta-ads.yaml (2026-10-19). The only edit:
# the image is the v2 ETL image, which runs these ETL_* settings through `etl legacy`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl-all-meta-ads
  namespace: etl
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "00 19 * * *"
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  suspend: false
  timeZone: UTC
  jobTemplate:
    metadata: {}
    spec:
      # Release the Job (and its pods) 24h after it finishes so a finished run
      # can never keep holding CPU/memory requests against wi-etl-pool.
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          annotations:
            # A scale-down must never kill a mid-run ETL. Required now that
            # wi-etl-pool is autoscaled.
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          labels:
            job: etl-all-meta-ads
        spec:
          priorityClassName: etl-critical
          containers:
          - name: etl
            image: asia-south1-docker.pkg.dev/clevrr-ai/clevrr-registry/clevrr-etl-v2:CHANGE-ME
            imagePullPolicy: IfNotPresent
            env:
            - name: CKH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: CH_PASS
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: PG_PASS
            - name: ETL_COMMAND
              value: "run-all-for-connector meta_ads --mode auto"
            - name: ETL_GROUP_PHASES
              value: advertising:psql_to_psql
            - name: ETL_DB_MODE
              value: both
            - name: ETL_SKIP_FETCH
              value: "false"
            - name: POSTGRES_HOST
              value: "127.0.0.1"
            - name: POSTGRES_PORT
              value: "5432"
            - name: ORCHESTRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: ORCHESTRA_API_TOKEN
            - name: ORCHESTRA_CHANNEL_UID
              value: "HBO1jKzlVsv1hyuRJVl7"
            - name: ETL_JOB_NAME
              value: "etl-all-meta-ads"
            envFrom:
            - configMapRef:
                name: etl-config
            resources:
              limits:
                cpu: "1500m"
                memory: 4Gi
              requests:
                cpu: "1"
                memory: 2Gi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          nodeSelector:
            cloud.google.com/gke-nodepool: wi-etl-pool
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccountName: cloud-sql-proxy
          terminationGracePeriodSeconds: 30
status: {}