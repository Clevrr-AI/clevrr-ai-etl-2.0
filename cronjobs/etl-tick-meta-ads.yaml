# `etl tick meta_ads` every hour (:00 UTC = :30 IST): runs the meta_ads pipelines for the orgs whose
# etl_schedules interval slot has started (docs/scheduling.md). Same ConfigMap, Secret, SA and
# node pool as etl-all-meta-ads.yaml, plus the v2 settings legacy's etl-config lacks (below).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl-tick-meta-ads
  namespace: etl
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "0 * * * *"
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  suspend: false
  timeZone: UTC
  jobTemplate:
    metadata: {}
    spec:
      # Release the Job (and its pods) 24h after it finishes so a finished run
      # can never keep holding CPU/memory requests against wi-etl-pool.
      ttlSecondsAfterFinished: 86400
      # Legacy's 2 h: a long first run skips the next ticks (Forbid) instead of being
      # killed half-way; an org it did not reach is still due at the next tick.
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          annotations:
            # A scale-down must never kill a mid-run ETL. Required now that
            # wi-etl-pool is autoscaled.
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          labels:
            job: etl-tick-meta-ads
        spec:
          priorityClassName: etl-critical
          containers:
          - name: etl
            image: asia-south1-docker.pkg.dev/clevrr-ai/clevrr-registry/clevrr-etl-v2:cutover-20261110d
            imagePullPolicy: IfNotPresent
            env:
            - name: CKH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: CH_PASS
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: PG_PASS
            - name: ETL_COMMAND
              value: "tick meta_ads"
            # v2 settings, on the job (not in etl-config, which the legacy jobs share):
            # legacy's image hard-codes the Cloud SQL instance, v2's starts the proxy only
            # when it is set; the cut-over flag lets `etl legacy` write public / clevrr_db;
            # the cluster makes deletes and DDL run ON CLUSTER on the _shard tables.
            - name: CLOUDSQL_INSTANCE
              value: "clevrr-ai:asia-south1:clevrr-psql-db-prod"
            - name: ETL_V2_CUTOVER
              value: "true"
            - name: CLICKHOUSE__CLUSTER
              value: "clevrr-cluster"
            - name: POSTGRES_HOST
              value: "127.0.0.1"
            - name: POSTGRES_PORT
              value: "5432"
            - name: ORCHESTRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: ORCHESTRA_API_TOKEN
            - name: ORCHESTRA_CHANNEL_UID
              value: "HBO1jKzlVsv1hyuRJVl7"
            - name: ETL_JOB_NAME
              value: "etl-tick-meta-ads"
            envFrom:
            - configMapRef:
                name: etl-config
            resources:
              limits:
                cpu: "1500m"
                memory: 4Gi
              requests:
                cpu: "1"
                memory: 2Gi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          nodeSelector:
            cloud.google.com/gke-nodepool: wi-etl-pool
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccountName: cloud-sql-proxy
          terminationGracePeriodSeconds: 30
status: {}