[project]
name = "clevrr-ai-etl-2-0"
version = "0.1.0"
description = "Clevrr ETL v2: provider data into Postgres and ClickHouse (plan Phase 7)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "clickhouse-connect>=1.9.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
]

[project.scripts]
etl = "etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs Docker (testcontainers Postgres, ClickHouse)",
    "live: calls a provider API or the sandbox; never in the default run",
]
addopts = "-m 'not live' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/demo generators are legacy files copied unchanged (ETL/demo_data); only run.py is v2 code.
extend-exclude = [
    "alembic/versions", "tools/demo/config.py", "tools/demo/shopify_generator.py",
    "tools/demo/meta_ads_generator.py", "tools/demo/delhivery_generator.py",
]

[tool.ruff.lint]
# S608: SQL built from strings. T20: print. BLE: blind except. C90: complexity.
# TID251: banned APIs (environment reads outside settings).
select = ["E", "W", "F", "I", "B", "UP", "S", "T20", "C90", "BLE", "RUF", "SIM", "TID", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.getenv".msg = "Read environment variables only in etl/core/settings.py."
"os.environ".msg = "Read environment variables only in etl/core/settings.py."

[tool.ruff.lint.per-file-ignores]
"etl/core/settings.py" = ["TID251"]
"etl/legacy.py" = ["TID251"]  # the legacy-settings boundary (etl legacy)
"tests/**" = ["S101", "S105", "S106", "S603", "S608", "TID251", "PLR0915"]
"scripts/**" = ["T20", "S603", "S607"]
"alembic/env.py" = ["TID251"]
# Builder files compose SQL from fixed identifiers (scripts/check_rules.py allows only these).
"etl/**/sql_*.py" = ["S608"]

[tool.pyright]
include = ["etl", "tests", "scripts", "alembic"]
exclude = ["**/__pycache__", ".venv", "alembic/versions"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["etl"]
reportMissingTypeStubs = false

[tool.importlinter]
root_package = "etl"

[[tool.importlinter.contracts]]
name = "etl.core does not depend on sources, steps, checks or the runner"
type = "forbidden"
source_modules = ["etl.core"]
forbidden_modules = ["etl.sources", "etl.steps", "etl.checks", "etl.runner", "etl.pipelines", "etl.cli"]
