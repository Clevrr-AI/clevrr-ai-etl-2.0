# The ETL's own Alembic (plan 7.6): data tables and the run ledger only. The database, user
# and target schema come from etl/core/settings.py (POSTGRES__*), never from this file.
[alembic]
script_location = %(here)s/alembic
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
