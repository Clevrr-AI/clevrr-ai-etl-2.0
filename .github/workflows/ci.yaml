# CI for clevrr-ai-etl-2.0 (plan 7.7, first part).
#
# Every push to main or Staging, and every pull request: uv sync --frozen -> ruff -> pyright -> import contracts ->
# ETL rules -> docker build -> smoke test (`etl list`). Tests are local only (git ignores
# tests/): run `uv run pytest` before you push.
#
# Deploy (plan 7.7), on Staging only (the sandbox deploy branch) and only when the repository variables GCP_WIF_PROVIDER,
# GCP_CI_SERVICE_ACCOUNT and ETL_IMAGE are set (terraform output in infra/): push the image
# tagged with the commit SHA (never `latest`), then move every CronJob (namespace etl) and Cloud
# Run Job labelled app=clevrr-etl-v2 to it: no hand-edited image tags. Keyless: Workload Identity Federation, no service-account key.
name: CI
on:
  push:
    branches: [main, Staging]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
env:
  UV_VERSION: "0.12.19"
jobs:
  checks:
    name: Lint, types, rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run python scripts/check_rules.py
  image:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: clevrr-etl-v2:ci
      - name: Smoke test
        run: docker run --rm clevrr-etl-v2:ci list
  deploy:
    name: Push image and update jobs
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/Staging' && vars.GCP_WIF_PROVIDER != ''
    env:
      # Sandbox defaults (not secrets); a repository variable of the same name overrides each.
      IMAGE: ${{ vars.ETL_IMAGE || 'asia-south1-docker.pkg.dev/clevrr-ai-sbx/clevrr-registry-sbx/clevrr-etl-v2' }}
      REGION: asia-south1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - run: gcloud auth configure-docker "${IMAGE%%/*}" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Move the Kubernetes CronJobs to the new image (cronjobs_dev/)
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER || 'clevrr-ckh-cluster-sandbox' }}
          location: ${{ vars.GKE_ZONE || 'asia-south1-a' }}
      - name: Move the existing etl-all-* CronJobs to the new image
        run: |
          for job in etl-all-shopify etl-all-shopify-catalog-daily etl-all-shopify-products               etl-all-meta-ads etl-all-google-ads etl-products-cost etl-custom-backfill; do
            kubectl set image cronjob/"$job" -n etl etl="$IMAGE:${GITHUB_SHA}"
          done
      - name: Move the Cloud Run Jobs too (infra/, kept as the GCP record)
        run: |
          for job in $(gcloud run jobs list --region "$REGION"               --filter="metadata.labels.app=clevrr-etl-v2" --format="value(metadata.name)"); do
            gcloud run jobs update "$job" --region "$REGION" --image "$IMAGE:${GITHUB_SHA}" --quiet
          done
