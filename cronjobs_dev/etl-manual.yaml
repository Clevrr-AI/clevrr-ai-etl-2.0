# One-off Job template for a v2 command on the sandbox (pg-migrate, schedule set ..., tick ...).
# Not applied as is: scripts/manual_job.py fills ETL_COMMAND and a unique name, then `kubectl apply`.
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-manual-__SUFFIX__
  namespace: etl
spec:
  activeDeadlineSeconds: 3500
  backoffLimit: 1
  template:
    metadata:
      labels:
        job: etl-manual
    spec:
      containers:
      - name: etl
        image: asia-south1-docker.pkg.dev/clevrr-ai-sbx/clevrr-registry-sbx/clevrr-etl-v2:manual-20261030-sched2
        imagePullPolicy: IfNotPresent
        env:
        - name: CKH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: CH_PASS
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: PG_PASS
        - name: ETL_COMMAND
          value: "__COMMAND__"
        - name: POSTGRES_HOST
          value: "127.0.0.1"
        - name: POSTGRES_PORT
          value: "5432"
        - name: ORCHESTRA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: etl-secrets
              key: ORCHESTRA_API_TOKEN
        - name: ORCHESTRA_CHANNEL_UID
          value: "5NZSk556rMz6gE4Nol1v"
        - name: ETL_JOB_NAME
          value: "etl-manual-__SUFFIX__"
        envFrom:
        - configMapRef:
            name: etl-config
        resources:
          limits:
            cpu: "4"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 2Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        cloud.google.com/gke-nodepool: wi-etl-pool-sbx
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: cloud-sql-proxy
      terminationGracePeriodSeconds: 30
